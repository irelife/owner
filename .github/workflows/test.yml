# ★ 自動検査
#
#   いつ走るか：
#     ・main へ何かを入れようとしたとき（プルリクエスト）
#     ・main が直接変わったとき
#     ・手で「実行」を押したとき
#
#   1件でも失敗したら赤くなり、マージのボタンが警告を出します。
#
#   ★ 2026/10/16 新設
#     検査そのものは前からありましたが、走らせるのは手でした。
#     PIVOT2・PIVOT3 には前からこの仕組みがあり、ここだけ無かったので足しました。

name: 自動検査

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: 検査
    # ★ 2026/10/17 ubuntu-latest → ubuntu-24.04（版を決め打ちにしました）
    #
    #   CI のログに、こういう知らせが出ていました。
    #     The ubuntu-latest label will migrate to Ubuntu 26
    #     beginning October 19, 2026
    #
    #   ubuntu-latest は「そのときいちばん新しいもの」という意味なので、
    #   10月19日から、検査を動かす機械の中身が勝手に入れ替わります。
    #   こちらが何も直していなくても、3リポジトリ同時に赤くなり得ます。
    #
    #   とくに  npx playwright install --with-deps  は OS 側の部品を入れる
    #   命令なので、OS が変わると部品の名前や有無が変わることがあります。
    #
    #   そこで版を決め打ちにします。向こうの都合で土台が動かなくなります。
    #   ubuntu-24.04 は 2027年まで使えます。26 へは、こちらが決めたときに
    #   この1行を変えて上げます（そのとき検査が通ることを確かめてから）。
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # ★ 2026/10/17 @v4 → @v5
      #   @v4 は Node.js 20 で動く作りですが、GitHub 側が 20 をやめたため、
      #   いまは 24 で無理に動かされています（毎回この警告が出ていました）。
      #       ##[warning]Node.js 20 is deprecated. … being forced to run on Node.js 24
      #   無理に動かすのをやめた日に、検査が3リポジトリ同時に止まります。
      #   @v5 は、はじめから 24 で動く作りです。
      #   ※ いちばん新しいのは @v7 ですが、@v5 ですでに 24 なので、
      #     この警告に対しては同じ効き目です。@v7 には別の変更
      #     （ESM 化・fork からの PR の扱い）が入るので、上げません。
      - name: リポジトリを取ってくる
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # ★ ?v= の上げ忘れを見るため、main と見くらべます

      - name: Node を用意する
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 検査の道具を入れる
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: ブラウザを入れる
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: ★ ?v= の上げ忘れを見る
        run: |
          git fetch origin main --depth=50 || true
          node tests/tver.cjs . origin/main

      - name: 検査を走らせる
        working-directory: tests
        run: node run-all.cjs ..
