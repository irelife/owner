<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>オーナー対応｜IREライフ株式会社（社内）</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FBF8F7">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ============================================================
 *  当社用のオーナー対応画面
 *
 *  ★この画面は社内用です。合言葉（ADMIN_KEY）を知らないと、
 *    何も読めません。合言葉はこのファイルには書きません。
 *    はじめて開いたときに聞いて、その端末の中だけに覚えます。
 * ============================================================ */
:root{
  --paper:#FBF8F7; --surface:#fff; --ink:#1C1A1B; --muted:#6F6669; --faint:#9C9296;
  --line:#EAE2E4; --line-soft:#F2ECEE; --brand:#C9184A; --brand-tint:#FCEFF3;
  --good:#2E7D5B; --good-tint:#EAF5F0; --warn:#8A5A12; --warn-tint:#FBF2E4;
  --shadow:0 1px 2px rgba(28,26,27,.05),0 8px 24px rgba(28,26,27,.06);
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--gothic);font-size:15.5px;line-height:1.8;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.bar{position:sticky;top:0;z-index:10;background:rgba(251,248,247,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  padding:0 16px;height:54px}
.logo{font-family:var(--mincho);font-weight:700;font-size:19px;letter-spacing:.04em}
.logo span{color:var(--brand)}
.bar .who{font-size:12.5px;color:var(--faint);margin-left:auto}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
h1{font-family:var(--mincho);font-size:22px;font-weight:700;margin:0 0 4px}
.sub{font-size:13.5px;color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:18px 16px;box-shadow:var(--shadow);margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:13px 14px;
  border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
textarea{line-height:1.8;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px}
.btn{width:100%;min-height:50px;margin-top:14px;font:inherit;font-size:16px;font-weight:700;
  color:#fff;background:var(--brand);border:0;border-radius:14px;cursor:pointer}
.btn:hover{opacity:.92}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line);
  min-height:44px;font-size:14.5px;width:auto;padding:0 18px;margin-top:10px}
.msg{display:block;min-height:20px;font-size:13.5px;color:var(--brand);margin-top:10px}
.msg.ok{color:var(--good)}
/* 支社のならび */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;padding:0 16px;border-radius:980px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);font:inherit;font-size:14px;
  color:var(--muted);display:flex;align-items:center;gap:7px}
.tab:hover{border-color:var(--faint);color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.tab .n{font-size:12.5px;font-weight:700;color:var(--brand);
  background:var(--brand-tint);border-radius:980px;padding:1px 8px}
.tab.on .n{background:rgba(255,255,255,.18);color:#fff}
.opt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);
  margin-bottom:14px;cursor:pointer}
.opt input{width:20px;height:20px;padding:0;flex:none}
/* やりとり1件 */
.th{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.th.open{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),var(--shadow)}
.th-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.th-o{font-size:15px;font-weight:700}
.chip{font-size:12px;font-weight:700;border-radius:980px;padding:2px 10px;
  background:var(--line-soft);color:var(--muted)}
.chip.open{background:var(--brand-tint);color:var(--brand)}
.chip.done{background:var(--good-tint);color:var(--good)}
.chip.area{background:var(--warn-tint);color:var(--warn)}
.th-t{font-size:14px;color:var(--muted);margin:0 0 12px;overflow-wrap:anywhere}
.talk{display:flex;flex-direction:column;gap:10px;
  border-top:1px solid var(--line-soft);padding-top:12px}
.bub{display:flex;flex-direction:column;gap:4px;max-width:88%;
  background:var(--paper);border:1px solid var(--line-soft);border-radius:12px;
  padding:10px 12px}
.bub.us{align-self:flex-end;background:var(--brand-tint);border-color:transparent}
.bub-w{font-size:11.5px;color:var(--faint)}
.bub-b{font-size:14.5px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.reply{margin-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row select{width:auto;min-width:130px;padding:10px 12px;font-size:14px}
.row .lab{font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--faint);font-size:14px;padding:30px 0}
.note{font-size:12.5px;color:var(--faint);margin-top:10px}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#171416;--surface:#211D1F;--ink:#F2EDEE;--muted:#AFA4A8;--faint:#7E7276;
    --line:#332C2F;--line-soft:#2A2427;--brand:#F0688F;--brand-tint:#331B23;
    --good:#6FC79E;--good-tint:#1B2A23;--warn:#E0A44F;--warn-tint:#2D2415;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}
}
</style>
</head>
<body>

<div class="bar">
  <span class="logo">IRE<span>ライフ</span></span>
  <span style="font-size:13px;color:var(--muted)">オーナー対応（社内）</span>
  <span class="who" id="who"></span>
</div>

<div class="wrap">

  <!-- 合言葉 -->
  <section id="s-gate">
    <h1>オーナー対応</h1>
    <p class="sub">合言葉を入れてください。この端末にだけ覚えます。</p>
    <div class="card">
      <label for="g-key">合言葉</label>
      <input type="password" id="g-key" autocomplete="off" spellcheck="false">
      <button type="button" class="btn" id="g-go">入る</button>
      <span class="msg" id="g-msg"></span>
      <p class="note">合言葉は Apps Script の「スクリプト プロパティ」の
        <b>ADMIN_KEY</b> です。社外に出さないでください。</p>
    </div>
  </section>

  <!-- 一覧 -->
  <section id="s-list" hidden>
    <h1>オーナー様とのやりとり</h1>
    <p class="sub">お返事がまだのものを上に出します。支社で分けて見られます。</p>

    <div class="tabs" id="tabs"></div>
    <label class="opt"><input type="checkbox" id="only" checked>
      お返事がまだのものだけ</label>

    <div id="list"></div>
    <p class="note" id="mails"></p>
  </section>

</div>

<script>
(function(){
  'use strict';
  /* ★ここに合言葉もURLも書きません。URLは config.js から借ります。 */
  var CFG  = {};
  var KKEY = 'ire_staff_key';
  var key  = '';
  var area = '';
  var cache = null;

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
    });
  }
  function say(el, t, ok){ if(el){ el.textContent = t || ''; el.classList.toggle('ok', !!ok); } }
  function busy(b, on, lab){
    if(!b) return;
    b.disabled = !!on;
    if(on){ if(b.dataset.busy !== '1'){ b.dataset.label = b.textContent; b.dataset.busy = '1'; }
            b.textContent = lab || '送信中…'; }
    else{ if(b.dataset.label) b.textContent = b.dataset.label; b.dataset.busy = ''; }
  }

  function call(action, data){
    var url = CFG.GAS_URL || '';
    if(!url || url.indexOf('script.google.com') < 0){
      return Promise.reject(new Error('設定がまだです。js/config.js をご確認ください。'));
    }
    var body = Object.assign({ action: action, key: key }, data || {});
    return fetch(url, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    })
    .then(function(r){ return r.json(); })
    .then(function(r){
      if(r && r.ok) return r;
      var e = new Error((r && r.message) || 'うまくいきませんでした。');
      e.code = (r && r.error) || ''; throw e;
    })
    .catch(function(e){
      if(e && e.code) throw e;
      var e2 = new Error('通信できませんでした。'); e2.code = 'net'; throw e2;
    });
  }

  /* ── 合言葉 ── */
  $('g-go').addEventListener('click', function(){
    var k = ($('g-key').value || '').trim();
    if(!k){ say($('g-msg'), '合言葉を入れてください。'); return; }
    busy($('g-go'), true, '確かめています…');
    key = k;
    call('stPing')
      .then(function(){
        try{ localStorage.setItem(KKEY, k); }catch(e){}
        $('g-key').value = '';
        say($('g-msg'), '');
        open_();
      })
      .catch(function(e){ key = ''; say($('g-msg'), e.message); })
      .then(function(){ busy($('g-go'), false); });
  });
  $('g-key').addEventListener('keydown', function(e){
    if(e.key === 'Enter') $('g-go').click();
  });

  function open_(){
    $('s-gate').hidden = true;
    $('s-list').hidden = false;
    $('who').textContent = '社内用';
    load();
  }

  /* ── 一覧 ── */
  $('only').addEventListener('change', load);

  function load(){
    $('list').innerHTML = '<div class="empty">読み込んでいます…</div>';
    call('stList', { area: area, open: $('only').checked })
      .then(function(r){ cache = r; paint(r); })
      .catch(function(e){
        if(e.code === 'auth'){
          key = ''; try{ localStorage.removeItem(KKEY); }catch(x){}
          $('s-gate').hidden = false; $('s-list').hidden = true;
          say($('g-msg'), '合言葉が違うようです。もう一度お願いします。');
          return;
        }
        $('list').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
      });
  }

  var AREAS = ['', '福山', '倉敷', '岡山', '?'];
  var LABEL = { '':'すべて', '福山':'福山', '倉敷':'倉敷・総社', '岡山':'岡山',
                '?':'支社がまだ' };

  function paint(r){
    var n = r.counts || {};
    $('tabs').innerHTML = AREAS.map(function(a){
      var c = n[a] || 0;
      return '<button type="button" class="tab' + (area === a ? ' on' : '') +
             '" data-a="' + esc(a) + '">' + esc(LABEL[a]) +
             (c ? '<span class="n">' + c + '</span>' : '') + '</button>';
    }).join('');
    Array.prototype.forEach.call($('tabs').querySelectorAll('.tab'), function(b){
      b.addEventListener('click', function(){ area = b.getAttribute('data-a'); load(); });
    });

    var m = r.mails || {};
    $('mails').textContent =
      '届け先： 福山 ' + (m['福山'] || '（未設定→SUPPORT）') +
      '／倉敷 ' + (m['倉敷'] || '（未設定→SUPPORT）') +
      '／岡山 ' + (m['岡山'] || '（未設定→SUPPORT）') +
      '／SUPPORT ' + (m.SUPPORT || '');

    var list = r.list || [];
    if(!list.length){
      $('list').innerHTML = '<div class="empty">' +
        ($('only').checked ? 'お返事がまだのものはありません。' : 'やりとりはまだありません。') +
        '</div>';
      return;
    }

    $('list').innerHTML = list.map(function(t){
      var talk = (t.msgs || []).map(function(x){
        var us = (x.who !== 'オーナー');
        return '<div class="bub' + (us ? ' us' : '') + '">' +
               '<span class="bub-w">' + esc(us ? 'IREライフ' : t.owner) +
               '　' + esc(x.at) + '</span>' +
               '<span class="bub-b">' + esc(x.body) + '</span></div>';
      }).join('');

      var sel = ['', '福山', '倉敷', '岡山'].map(function(a){
        return '<option value="' + esc(a) + '"' + (t.area === a ? ' selected' : '') + '>' +
               esc(a ? a : '（未設定）') + '</option>';
      }).join('');

      return '<div class="th' + (t.open ? ' open' : '') + '">' +
        '<div class="th-h">' +
          '<span class="th-o">' + esc(t.owner) + '</span>' +
          '<span class="chip' + (t.open ? ' open' : ' done') + '">' +
            (t.open ? '未返信' : '返信済み') + '</span>' +
          '<span class="chip">' + esc(t.type) + '</span>' +
          (t.area ? '<span class="chip area">' + esc(t.area) + '</span>'
                  : '<span class="chip area">支社がまだ</span>') +
        '</div>' +
        '<p class="th-t">' + esc(t.title) + '　<span style="color:var(--faint)">' +
          esc(t.id) + '</span></p>' +
        '<div class="talk">' + talk + '</div>' +
        '<div class="reply">' +
          '<textarea rows="3" data-w="' + esc(t.id) +
            '" placeholder="お返事をお書きください。オーナー様の画面に出ます。"></textarea>' +
          '<button type="button" class="btn ghost" data-send="' + esc(t.id) +
            '" data-mail="' + esc(t.mail) + '">返信する</button>' +
          '<span class="msg" data-msg="' + esc(t.id) + '"></span>' +
        '</div>' +
        '<div class="row">' +
          '<span class="lab">この方の支社</span>' +
          '<select data-area="' + esc(t.mail) + '">' + sel + '</select>' +
        '</div>' +
      '</div>';
    }).join('');

    Array.prototype.forEach.call($('list').querySelectorAll('[data-send]'), function(b){
      b.addEventListener('click', function(){ reply(b); });
    });
    Array.prototype.forEach.call($('list').querySelectorAll('[data-area]'), function(sl){
      sl.addEventListener('change', function(){
        call('stArea', { mail: sl.getAttribute('data-area'), area: sl.value })
          .then(function(){ load(); })
          .catch(function(e){ window.alert(e.message); });
      });
    });
  }

  function reply(btn){
    var id = btn.getAttribute('data-send');
    var ta  = $('list').querySelector('[data-w="' + id + '"]');
    var msg = $('list').querySelector('[data-msg="' + id + '"]');
    var body = ta ? (ta.value || '').trim() : '';
    if(!body){ say(msg, '本文をお書きください。'); return; }

    busy(btn, true);
    call('stReply', { id:id, body:body, mail: btn.getAttribute('data-mail') })
      .then(function(){ if(ta) ta.value = ''; load(); })
      .catch(function(e){ say(msg, e.message); })
      .then(function(){ busy(btn, false); });
  }

  /* ── 起動 ── */
  function boot(){
    CFG = window.APP_CONFIG || {};
    try{ key = localStorage.getItem(KKEY) || ''; }catch(e){ key = ''; }
    if(!key) return;
    call('stPing').then(open_).catch(function(){
      key = ''; try{ localStorage.removeItem(KKEY); }catch(e){}
    });
  }
  var sc = document.createElement('script');
  sc.src = 'js/config.js?v=9';
  sc.onload = boot;
  sc.onerror = boot;
  document.head.appendChild(sc);
})();
</script>
</body>
</html>
